<div
  class="simulator-shell"
  [class.theme-dark]="theme === 'DARK'"
  [class.frozen]="paused">

  <!-- Word editor area (real editor arrives in a later phase) -->
  <main class="editor-area" aria-label="Document editor"></main>

  <!-- Shared learning UI -->
  <lib-confetti [play]="confettiPlay"></lib-confetti>

  <aside class="checker" *ngIf="taskState as state">

    <!-- Working: task card plus retry feedback -->
    <ng-container *ngIf="state.status === 'active' || state.status === 'incorrect'">

      <lib-task-card
        [task]="state.task"
        [disabled]="paused"
        (checkWork)="onCheckWork()"
        (showHow)="onShowMeHow()">
      </lib-task-card>

      <lib-feedback-card
        [status]="state.status === 'incorrect' ? 'incorrect' : null"
        [hint]="state.task.hint">
      </lib-feedback-card>

    </ng-container>

    <!-- Passed: success card and Continue -->
    <ng-container *ngIf="state.status === 'correct' || state.status === 'completed'">

      <lib-feedback-card status="correct"></lib-feedback-card>

      <button
        type="button"
        class="continue-button"
        [disabled]="paused || state.status === 'completed'"
        (click)="onContinue()">

        Continue →

      </button>

    </ng-container>

    <lib-mascot [state]="mascotState"></lib-mascot>

  </aside>

</div>
